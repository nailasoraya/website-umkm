      <main id="konten" class="page">
        <h1>Galeri Secangkir Jeda</h1>
        <section aria-labelledby="media-title">
            <h2 id="media-title">Media Usaha</h2>
            <div class="gallery-grid">
                <figure class="media-card">
                    <img
                        src="assets/images/latte.png"
                        alt="Etalase Secangkir Jeda berisi kemasan kopi lokal"
                        class="latte-image"
                    />
                    <figcaption>
                        Etalase produk membantu pelanggan mengenali pilihan kopi.
                    </figcaption>
                </figure>

                <figure class="media-card">
                    <img
                        src="assets/images/proses_seduh.jpeg"
                        width="640"
                        height="360"
                        loading="lazy"
                        alt="Barista menuang air panas ke dripper kopi"
                        class="process-image"
                    />
                    <figcaption>
                        Proses seduh manual menjadi bagian dari cerita produk.
                    </figcaption>
                </figure>
            </div>
        </section>

      <section class="products-section" aria-labelledby="audio-title">

          <p id="audio-note">
