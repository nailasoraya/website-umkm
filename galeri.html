<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produk Kopi Nusa - Website UMKM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <a class="skip-link" href="#konten">Lewati ke konten utama</a>
    <header class="site-header">
        <div class="page">
            <nav class="navbar" aria-label="Navigasi utama">
                <a href="index.html">Beranda</a>
                <a href="tentang.html">Tentang Kami</a>
                <a href="produk.html">Produk</a>
                <a href="galeri.html">Galeri</a>
                <a href="index.html#kontak">Kontak Singkat</a>
            </nav>
        </div>
    </header>
    
      <main id="konten" class="page">

      <section class="products-section" aria-labelledby="media-title">
          <h1>Galeri Secangkir Jeda</h1>

          <h2 id="media-title">Media Usaha</h2>

          <figure>
            <img
                  src="assets/images/latte.png"
                  alt="Etalase Secangkir Jeda berisi kemasan kopi lokal"
                  class="latte-image"
            />
              <figcaption>
                  Etalase produk membantu pelanggan mengenali pilihan kopi.
              </figcaption>
          </figure>

          <figure>
            <img
                src="assets/images/proses-seduh.svg"
                alt="Barista menuang air panas ke dripper kopi"
                class="process-image"
            />
              <figcaption>
                  Proses seduh manual menjadi bagian dari cerita produk.
              </figcaption>
          </figure>
      </section>

      <section class="products-section" aria-labelledby="audio-title">
          <h2 id="audio-title">Nada Penanda Kedai</h2>

          <p id="audio-note">
              Nada uji singkat memastikan elemen audio dan kontrol browser dapat diperiksa.
          </p>

          <audio
              controls
              aria-describedby="audio-note"
              src="assets/audio/cafe-music.mp3"
          >
              Browser Anda tidak mendukung pemutar audio.
          </audio>
      </section>

  </main>

    <footer class="site-footer">
        <div class="page">
            <p>&copy; 2026 Secangkir Jeda. UMKM Lokal Pekalongan.</p>
        </div>
    </footer>
